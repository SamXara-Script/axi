<!doctype html>
<html lang="en">
<head>
<!--#include head-->
  <title>{{t:meta.news.title}}</title>
  <meta name="i18n-title" content="meta.news.title">
  <meta name="description" content="{{t:meta.news.description}}">
</head>
<body data-page="{{page}}">
<!--#include header-->

<main id="main">
  <section class="page-hero" id="top" data-floor="01" data-floor-label="floors.overview">
    <div class="container">
      <p class="eyebrow" data-i18n="news.eyebrow">{{t:news.eyebrow}}</p>
      <h1 class="display page-hero__display" data-reveal="lines" data-i18n="news.title">{{t:news.title}}</h1>
      <p class="lead page-hero__lead" data-reveal="fade" data-i18n="news.lead">{{t:news.lead}}</p>
    </div>
  </section>

  <section class="section" id="list" data-floor="02" data-floor-label="floors.news">
    <div class="container">
      <div class="row news-filters" data-news-filters role="group" aria-label="Filter"></div>
      <div class="news-grid" data-news></div>
    </div>
  </section>
</main>

<!--#include footer-->
</body>
</html>
